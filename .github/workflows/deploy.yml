# .github/workflows/deploy.yml
# Accurova Workflow Dashboard — CI
#
# Branches:
#   dev  → runs tests only
#   main → tests only — Zeabur's own GitHub integration auto-deploys both
#          services on every push to main (Git-connected services redeploy
#          on push natively; there's no separate "deploy hook" webhook
#          setting in Zeabur to trigger here). This workflow is a quality
#          gate, not the deploy trigger.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. BACKEND TESTS ──────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests never touch the real sheet — validation happens before any
          # Google Sheets API call, so no credentials are required here.
          PORT: 3001
          ADMIN_PASSWORD: test-password

  # ── 2. FRONTEND LINT / BUILD ──────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Points to production backend — Vite bakes this into the bundle
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
