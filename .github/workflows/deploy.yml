# .github/workflows/deploy.yml
# Accurova Workflow Dashboard — CI/CD
#
# Branches:
#   dev  → runs tests only
#   main → tests + auto-deploy to Zeabur via webhook

name: CI / Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. BACKEND TESTS ──────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests use a dedicated test Supabase project — never prod
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_TEST }}
          PORT: 3001

  # ── 2. FRONTEND LINT / BUILD ──────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Points to production backend — Vite bakes this into the bundle
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. DEPLOY (main branch only) ─────────────────────────────────────────
  deploy:
    name: Deploy to Zeabur
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Zeabur deploy — Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.ZEABUR_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger Zeabur deploy — Frontend
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.ZEABUR_DEPLOY_HOOK_FRONTEND }}"

      - name: Confirm deploy triggered
        run: echo "Zeabur deploy hooks fired. Check Zeabur dashboard for status."
